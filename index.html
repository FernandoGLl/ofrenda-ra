<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ofrenda Interactiva - Día de Muertos</title>

  <!-- Versiones fijas y estables -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #ui-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    #warning-msg {
      background-color: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: auto;
      margin-top: 60px;
      font-weight: bold;
      display: block;
      text-align: center;
    }

    #controls {
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 15px 15px 0 0;
      width: 100%;
      box-sizing: border-box;
      display: none;
      pointer-events: auto;
      text-align: center;
    }

    button {
      background-color: #ff8c00;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:active { background-color: #cc7000; }

    /* Panel de depuración */
    #debug-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      max-height: 35%;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.3;
      padding: 4px 6px;
      box-sizing: border-box;
      z-index: 9999;
      pointer-events: none;
      display: none;
    }
    #debug-panel .err { color: #ff5252; }
    #debug-panel .warn { color: #ffd740; }
  </style>

  <script>
    // ===== DEPURACIÓN =====
    // Pon false para ocultar el panel cuando todo funcione.
    // También puedes forzarlo con la URL: ...index.html?debug=1
    const DEBUG = true;

    function dbg(msg, cls) {
      const panel = document.getElementById('debug-panel');
      if (!panel) return;
      const line = document.createElement('div');
      if (cls) line.className = cls;
      const t = new Date().toLocaleTimeString();
      line.textContent = '[' + t + '] ' + msg;
      panel.appendChild(line);
      panel.scrollTop = panel.scrollHeight;
    }

    window.addEventListener('error', function (e) {
      dbg('ERROR JS: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')', 'err');
    });
    window.addEventListener('unhandledrejection', function (e) {
      dbg('PROMESA RECHAZADA: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'err');
    });

    window.addEventListener('DOMContentLoaded', function () {
      if (DEBUG || location.search.indexOf('debug=1') !== -1) {
        document.getElementById('debug-panel').style.display = 'block';
      }

      dbg('Página cargada');
      dbg('AFRAME: ' + (window.AFRAME ? AFRAME.version : 'NO CARGÓ'), window.AFRAME ? '' : 'err');
      dbg('HTTPS: ' + (location.protocol === 'https:' ? 'sí' : 'NO (la cámara no funciona sin HTTPS)'),
          location.protocol === 'https:' ? '' : 'err');

      // Verificar cámara
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        dbg('Este navegador no soporta getUserMedia (cámara)', 'err');
      } else {
        dbg('Pidiendo permiso de cámara...');
      }

      // Verificar que existan los archivos (HEAD)
      ['video_pan.mp4', 'video_calavera.mp4', 'pattern-PanMuertosIC.patt', 'pattern-CalaveraIC.patt']
        .forEach(function (f) {
          fetch(f, { method: 'HEAD' })
            .then(function (r) {
              const size = r.headers.get('content-length');
              dbg(f + ' -> HTTP ' + r.status + (size ? ' (' + Math.round(size / 1024) + ' KB)' : ''),
                  r.ok ? '' : 'err');
            })
            .catch(function (err) { dbg(f + ' -> falló: ' + err.message, 'err'); });
        });

      // Estado de los videos
      document.querySelectorAll('video').forEach(function (v) {
        v.addEventListener('loadeddata', function () { dbg(v.id + ': cargado OK'); });
        v.addEventListener('error', function () {
          const c = v.error ? v.error.code : '?';
          dbg(v.id + ': ERROR al cargar (código ' + c + ')', 'err');
        });
      });

      // Eventos de la escena
      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', function () { dbg('Escena A-Frame lista'); });
      scene.addEventListener('camera-init', function () { dbg('Cámara iniciada OK'); });
      scene.addEventListener('camera-error', function (e) {
        dbg('ERROR DE CÁMARA: ' + (e.detail && e.detail.error ? e.detail.error.name + ' ' + e.detail.error.message : 'desconocido'), 'err');
      });
    });

    // ===== LÓGICA DE LA EXPERIENCIA =====
    window.activeMarker = null;

    AFRAME.registerComponent('ar-controller', {
      init: function () {
        const marker = this.el;

        marker.addEventListener('markerFound', function () {
          document.getElementById('warning-msg').style.display = 'none';
          document.getElementById('controls').style.display = 'block';
          window.activeMarker = marker.id;
          dbg('Marcador detectado: ' + marker.id, 'warn');
        });

        marker.addEventListener('markerLost', function () {
          document.getElementById('warning-msg').style.display = 'block';
          document.getElementById('controls').style.display = 'none';
          window.activeMarker = null;
          dbg('Marcador perdido: ' + marker.id);

          document.querySelectorAll('.info-text').forEach(el => el.setAttribute('visible', 'false'));
          document.querySelectorAll('a-video').forEach(el => el.setAttribute('visible', 'false'));
          document.querySelectorAll('video').forEach(vid => vid.pause());
        });
      }
    });

    function mostrarTexto() {
      document.querySelectorAll('a-video').forEach(el => el.setAttribute('visible', 'false'));
      document.querySelectorAll('video').forEach(vid => vid.pause());

      if (window.activeMarker === 'marker-pan') {
        document.getElementById('text-pan').setAttribute('visible', 'true');
      } else if (window.activeMarker === 'marker-calavera') {
        document.getElementById('text-calavera').setAttribute('visible', 'true');
      }
    }

    function reproducirVideo() {
      document.querySelectorAll('.info-text').forEach(el => el.setAttribute('visible', 'false'));

      const vidId = (window.activeMarker === 'marker-pan') ? 'vid-pan' : 'vid-calavera';
      const dispId = (window.activeMarker === 'marker-pan') ? 'display-pan' : 'display-calavera';

      const vid = document.getElementById(vidId);
      document.getElementById(dispId).setAttribute('visible', 'true');

      dbg('Reproduciendo ' + vidId + ' (readyState=' + vid.readyState + ')');
      vid.play().then(function () {
        dbg('Video en reproducción');
      }).catch(function (error) {
        dbg('No se pudo reproducir: ' + error.message, 'err');
      });
    }

    function reiniciarExperiencia() {
      document.querySelectorAll('video').forEach(vid => {
        vid.pause();
        vid.currentTime = 0;
      });
      document.querySelectorAll('a-video').forEach(el => el.setAttribute('visible', 'false'));
      document.querySelectorAll('.info-text').forEach(el => el.setAttribute('visible', 'false'));
    }
  </script>
</head>
<body>

  <div id="debug-panel"></div>

  <div id="ui-layer">
    <div id="warning-msg">⚠️ Marcador perdido. Apunta al objeto para continuar.</div>
    <div id="controls">
      <button onclick="mostrarTexto()">Leer Historia</button>
      <button onclick="reproducirVideo()">Ver Video</button>
      <button onclick="reiniciarExperiencia()" style="background-color: #555;">Reiniciar</button>
    </div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; alpha: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.68; trackingMethod: best;">

    <a-assets>
      <video id="vid-pan" src="video_pan.mp4" preload="auto" loop crossorigin="anonymous"
             playsinline webkit-playsinline
             onerror="dbg('No carga video_pan.mp4', 'err')"></video>
      <video id="vid-calavera" src="video_calavera.mp4" preload="auto" loop crossorigin="anonymous"
             playsinline webkit-playsinline
             onerror="dbg('No carga video_calavera.mp4', 'err')"></video>
    </a-assets>

    <!-- Marcador 1: Pan de Muerto -->
    <a-marker type="pattern" url="pattern-PanMuertosIC.patt" id="marker-pan" ar-controller>
      <a-video src="#vid-pan" id="display-pan" width="1.6" height="0.9" position="0 0.5 0" rotation="-90 0 0" visible="false"></a-video>
      <a-text class="info-text" id="text-pan" value="El pan de muerto\nrepresenta el ciclo\nde la vida y la muerte." position="0 1 0" rotation="-90 0 0" align="center" scale="1 1 1" visible="false" color="#ff8c00"></a-text>
    </a-marker>

    <!-- Marcador 2: Calaverita -->
    <a-marker type="pattern" url="pattern-CalaveraIC.patt" id="marker-calavera" ar-controller>
      <a-video src="#vid-calavera" id="display-calavera" width="1.6" height="0.9" position="0 0.5 0" rotation="-90 0 0" visible="false"></a-video>
      <a-text class="info-text" id="text-calavera" value="Las calaveritas\nnos recuerdan que la\nmuerte es un destino dulce." position="0 1 0" rotation="-90 0 0" align="center" scale="1 1 1" visible="false" color="#ffffff"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
