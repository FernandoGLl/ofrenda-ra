<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ofrenda Interactiva AR - Día de Muertos</title>

  <!-- Versiones fijas y estables (CDN confiable de producción) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #ui-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    #warning-msg {
      background-color: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: auto;
      margin-top: 60px;
      font-weight: bold;
      display: block;
      text-align: center;
    }

    #controls {
      background: rgba(0, 0, 0, 0.7);
      padding: 16px;
      border-radius: 15px 15px 0 0;
      width: 100%;
      box-sizing: border-box;
      display: none;
      pointer-events: auto;
      text-align: center;
    }

    button {
      background-color: #ff8c00;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:active { background-color: #cc7000; }

    /* Recuadro de "Leer Historia" */
    #story-box {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 520px);
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.88);
      color: #ffffff;
      border: 2px solid #ff8c00;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      line-height: 1.45;
      display: none;
      z-index: 20;
      pointer-events: auto;
    }
    #story-box h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: #ff8c00;
    }
    #story-box p { margin: 0 0 12px 0; }
    #story-box .btn-close {
      background-color: #444;
      padding: 6px 14px;
      font-size: 14px;
    }

    #ajustes { display: block; }

    /* Panel de depuración */
    #debug-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      max-height: 35%;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.3;
      padding: 4px 6px;
      box-sizing: border-box;
      z-index: 9999;
      pointer-events: none;
      display: none;
    }
    #debug-panel .err { color: #ff5252; }
    #debug-panel .warn { color: #ffd740; }
  </style>

  <script>
    const DEBUG = false;
    const MODO_DEBUG = DEBUG || location.search.indexOf('debug=1') !== -1;

    function dbg(msg, cls) {
      if (!MODO_DEBUG) return;
      const panel = document.getElementById('debug-panel');
      if (!panel) return;
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      panel.appendChild(line);
      while (panel.children.length > 60) panel.removeChild(panel.firstChild);
      panel.scrollTop = panel.scrollHeight;
    }

    window.addEventListener('error', function (e) {
      dbg('ERROR JS: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')', 'err');
    });
    window.addEventListener('unhandledrejection', function (e) {
      dbg('PROMESA RECHAZADA: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'err');
    });

    window.addEventListener('DOMContentLoaded', function () {
      if (MODO_DEBUG) {
        document.getElementById('debug-panel').style.display = 'block';
      }

      dbg('Página cargada');
      dbg('AFRAME: ' + (window.AFRAME ? AFRAME.version : 'NO CARGÓ'), window.AFRAME ? '' : 'err');

      document.querySelectorAll('video').forEach(function (v) {
        v.addEventListener('loadeddata', function () { dbg(v.id + ': cargado OK'); });
        v.addEventListener('error', function () {
          dbg(v.id + ': ERROR al cargar video (código ' + (v.error ? v.error.code : '?') + ')', 'err');
        });
      });

      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', function () { dbg('Escena A-Frame lista'); });
      scene.addEventListener('camera-error', function (e) {
        dbg('ERROR DE CÁMARA: ' + (e.detail && e.detail.error ? e.detail.error.name + ' ' + e.detail.error.message : 'desconocido'), 'err');
      });
    });

    // ===== TEXTOS DE HISTORIA =====
    const HISTORIAS = {
      'marker-hiro': {
        titulo: 'Altar de Día de Muertos',
        texto: 'En la tradición mexicana, las ofrendas representan el camino y homenaje a nuestros seres queridos. El escalón inferior simboliza la tierra, mientras que el nivel superior alberga la memoria y retrato del homenajeado.'
      }
    };

    // ===== LÓGICA DE LA EXPERIENCIA =====
    window.activeMarker = null;

    function ocultarHistoria() {
      document.getElementById('story-box').style.display = 'none';
    }

    function ocultarVideos() {
      document.querySelectorAll('.ar-group').forEach(function (el) { el.setAttribute('visible', 'false'); });
      document.querySelectorAll('video').forEach(function (vid) { vid.pause(); });
    }

    const NOMBRES = { 'marker-hiro': 'Marcador Hiro' };
    const visibles = new Set();

    function actualizarEtiqueta() {
      const el = document.getElementById('marker-name');
      el.textContent = window.activeMarker ? ('Marcador detectado: ' + (NOMBRES[window.activeMarker] || window.activeMarker)) : '';
    }

    function mostrarInterfaz(si) {
      document.getElementById('warning-msg').style.display = si ? 'none' : 'block';
      document.getElementById('controls').style.display = si ? 'block' : 'none';
    }

    AFRAME.registerComponent('ar-controller', {
      init: function () {
        const marker = this.el;
        let lostTimer = null;

        marker.addEventListener('markerFound', function () {
          if (lostTimer) { clearTimeout(lostTimer); lostTimer = null; }
          visibles.add(marker.id);

          if (window.activeMarker && window.activeMarker !== marker.id) {
            ocultarHistoria();
            ocultarVideos();
          }
          window.activeMarker = marker.id;
          mostrarInterfaz(true);
          actualizarEtiqueta();
          dbg('Marcador detectado: ' + marker.id, 'warn');
        });

        marker.addEventListener('markerLost', function () {
          dbg('Marcador perdido: ' + marker.id);
          if (lostTimer) clearTimeout(lostTimer);
          lostTimer = setTimeout(function () {
            lostTimer = null;
            visibles.delete(marker.id);

            if (visibles.size === 0) {
              window.activeMarker = null;
              mostrarInterfaz(false);
              ocultarHistoria();
              ocultarVideos();
            } else if (window.activeMarker === marker.id) {
              window.activeMarker = Array.from(visibles).pop();
              ocultarHistoria();
              ocultarVideos();
            }
            actualizarEtiqueta();
          }, 1500);
        });
      }
    });

    function mostrarTexto() {
      ocultarVideos();
      const h = HISTORIAS[window.activeMarker];
      if (!h) { dbg('No hay historia para: ' + window.activeMarker, 'err'); return; }
      document.getElementById('story-title').textContent = h.titulo;
      document.getElementById('story-text').textContent = h.texto;
      document.getElementById('story-box').style.display = 'block';
    }

    function reproducirVideo() {
      ocultarHistoria();
      ocultarVideos();

      if (window.activeMarker !== 'marker-hiro') return;

      const vid = document.getElementById('vid-hiro');
      document.getElementById('group-hiro').setAttribute('visible', 'true');

      dbg('Reproduciendo ' + vid.id);
      vid.play().then(function () {
        dbg('Video en reproducción');
      }).catch(function (error) {
        dbg('No se pudo reproducir: ' + error.message, 'err');
      });
    }

    function reiniciarExperiencia() {
      document.querySelectorAll('video').forEach(function (vid) {
        vid.pause();
        vid.currentTime = 0;
      });
      ocultarVideos();
      ocultarHistoria();
    }

    // ===== AJUSTE DE ORIENTACIÓN Y TAMAÑO =====
    let contentRot = 0;
    let contentScale = 1.0;

    function aplicarAjuste() {
      document.querySelectorAll('.ar-video').forEach(function (el) {
        el.setAttribute('rotation', '0 ' + contentRot + ' 0');
      });
      document.querySelectorAll('.altar').forEach(function (el) {
        el.setAttribute('rotation', '0 ' + contentRot + ' 0');
      });
      document.querySelectorAll('.ar-group').forEach(function (el) {
        el.setAttribute('scale', contentScale + ' ' + contentScale + ' ' + contentScale);
      });
      dbg('Ajuste -> rotación=' + contentRot + ' escala=' + contentScale.toFixed(2), 'warn');
    }
    function rotarContenido() { contentRot = (contentRot + 90) % 360; aplicarAjuste(); }
    function cambiarEscala(f) { contentScale = Math.max(0.3, Math.min(6, contentScale * f)); aplicarAjuste(); }
  </script>
</head>
<body>

  <div id="debug-panel"></div>

  <div id="story-box">
    <h2 id="story-title"></h2>
    <p id="story-text"></p>
    <button class="btn-close" onclick="ocultarHistoria()">Cerrar</button>
  </div>

  <div id="ui-layer">
    <div id="warning-msg">⚠️ Apunta la cámara al marcador Hiro para ver el altar.</div>
    <div id="controls">
      <div id="marker-name" style="color:#ffd740; font-size:14px; margin-bottom:4px;"></div>
      <button onclick="mostrarTexto()">Leer Historia</button>
      <button onclick="reproducirVideo()">Ver Video</button>
      <button onclick="reiniciarExperiencia()" style="background-color: #555;">Reiniciar</button>
      <div id="ajustes">
        <button onclick="rotarContenido()" style="background-color: #1e88e5;">⟳ Rotar</button>
        <button onclick="cambiarEscala(1.25)" style="background-color: #1e88e5;">＋ Grande</button>
        <button onclick="cambiarEscala(0.8)" style="background-color: #1e88e5;">－ Chico</button>
      </div>
    </div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: false; alpha: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;">

    <a-assets>
      <!-- Cambia 'video_pan.mp4' por la ruta de tu video principal -->
      <video id="vid-hiro" src="video_pan.mp4" preload="auto" loop crossorigin="anonymous"
             playsinline webkit-playsinline
             onerror="dbg('No carga el video', 'err')"></video>
    </a-assets>

    <!-- Marcador estándar Hiro -->
    <a-marker preset="hiro" id="marker-hiro" ar-controller
              smooth="true" smooth-count="8" smooth-tolerance="0.01" smooth-threshold="2">
      <a-entity class="ar-group" id="group-hiro" scale="1 1 1" visible="false">

        <!-- Altar de 2 niveles (Cajas rectangulares sólidas oscuras) -->
        <a-entity class="altar" position="0 0 0">
          <!-- Escalón 1 (Base): Rectángulo amplio negro azabache / grafito -->
          <a-box width="2.4" height="0.3" depth="1.6" position="0 0.15 0" color="#16161a"></a-box>
          
          <!-- Escalón 2 (Nivel superior): Rectángulo ligeramente más pequeño morado noche -->
          <a-box width="1.8" height="0.3" depth="1.0" position="0 0.45 -0.2" color="#2b142c"></a-box>
        </a-entity>

        <!-- Video vertical situado justo en el nivel superior tipo retrato -->
        <a-video class="ar-video" src="#vid-hiro" width="1.4" height="0.9"
                 position="0 1.05 -0.2" rotation="0 0 0"></a-video>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
