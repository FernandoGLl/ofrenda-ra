<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ofrenda Interactiva - Día de Muertos</title>

  <!-- Versiones fijas y estables -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #ui-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    #warning-msg {
      background-color: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: auto;
      margin-top: 60px;
      font-weight: bold;
      display: block;
      text-align: center;
    }

    #controls {
      background: rgba(0, 0, 0, 0.7);
      padding: 16px;
      border-radius: 15px 15px 0 0;
      width: 100%;
      box-sizing: border-box;
      display: none;
      pointer-events: auto;
      text-align: center;
    }

    button {
      background-color: #ff8c00;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:active { background-color: #cc7000; }

    /* Recuadro de "Leer Historia" (HTML normal: no usa texto 3D, así no se traba) */
    #story-box {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 520px);
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      border: 2px solid #ff8c00;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.45;
      display: none;
      z-index: 20;
      pointer-events: none;
    }
    #story-box h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: #ff8c00;
    }
    #story-box p { margin: 0; }

    /* Botones de ajuste (rotar / tamaño) */
    #ajustes { display: block; }

    /* Panel de depuración */
    #debug-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      max-height: 35%;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.3;
      padding: 4px 6px;
      box-sizing: border-box;
      z-index: 9999;
      pointer-events: none;
      display: none;
    }
    #debug-panel .err { color: #ff5252; }
    #debug-panel .warn { color: #ffd740; }
  </style>

  <script>
    // ===== DEPURACIÓN =====
    // Panel apagado por defecto. Para verlo abre la página con ?debug=1
    // o cambia false por true aquí.
    const DEBUG = false;
    const MODO_DEBUG = DEBUG || location.search.indexOf('debug=1') !== -1;

    function dbg(msg, cls) {
      if (!MODO_DEBUG) return;
      const panel = document.getElementById('debug-panel');
      if (!panel) return;
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      panel.appendChild(line);
      while (panel.children.length > 60) panel.removeChild(panel.firstChild);
      panel.scrollTop = panel.scrollHeight;
    }

    window.addEventListener('error', function (e) {
      dbg('ERROR JS: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')', 'err');
    });
    window.addEventListener('unhandledrejection', function (e) {
      dbg('PROMESA RECHAZADA: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'err');
    });

    window.addEventListener('DOMContentLoaded', function () {
      if (MODO_DEBUG) {
        document.getElementById('debug-panel').style.display = 'block';
              }

      dbg('Página cargada');
      dbg('AFRAME: ' + (window.AFRAME ? AFRAME.version : 'NO CARGÓ'), window.AFRAME ? '' : 'err');

      ['video_pan.mp4', 'video_calavera.mp4', 'pattern-PanMuertosIC.patt?v=3', 'pattern-CalaveraIC.patt?v=3']
        .forEach(function (f) {
          fetch(f, { method: 'HEAD' })
            .then(function (r) {
              const size = r.headers.get('content-length');
              dbg(f + ' -> HTTP ' + r.status + (size ? ' (' + Math.round(size / 1024) + ' KB)' : ''),
                  r.ok ? '' : 'err');
            })
            .catch(function (err) { dbg(f + ' -> falló: ' + err.message, 'err'); });
        });

      document.querySelectorAll('video').forEach(function (v) {
        v.addEventListener('loadeddata', function () { dbg(v.id + ': cargado OK'); });
        v.addEventListener('error', function () {
          dbg(v.id + ': ERROR al cargar (código ' + (v.error ? v.error.code : '?') + ')', 'err');
        });
      });

      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', function () { dbg('Escena A-Frame lista'); });
      scene.addEventListener('camera-error', function (e) {
        dbg('ERROR DE CÁMARA: ' + (e.detail && e.detail.error ? e.detail.error.name + ' ' + e.detail.error.message : 'desconocido'), 'err');
      });
    });

    // ===== TEXTOS DE "LEER HISTORIA" =====
    // Para intercambiar quién va con cada marcador, cambia las claves.
    const HISTORIAS = {
      'marker-pan': {
        titulo: 'Charles Babbage (1791–1871)',
        texto: 'Matemático e inventor inglés, considerado el padre de la computación por idear y diseñar la primera máquina analítica, considerada el concepto inicial de un ordenador programable.'
      },
      'marker-calavera': {
        titulo: 'Ada Lovelace (1815–1852)',
        texto: 'Matemática y escritora inglesa, reconocida como la primera programadora de la historia por escribir un algoritmo destinado a la máquina analítica de Babbage.'
      }
    };

    // ===== LÓGICA DE LA EXPERIENCIA =====
    window.activeMarker = null;

    function ocultarHistoria() {
      document.getElementById('story-box').style.display = 'none';
    }

    function ocultarVideos() {
      document.querySelectorAll('.ar-group').forEach(function (el) { el.setAttribute('visible', 'false'); });
      document.querySelectorAll('video').forEach(function (vid) { vid.pause(); });
    }

    const NOMBRES = { 'marker-pan': 'Pan de muerto', 'marker-calavera': 'Calavera' };
    const visibles = new Set();   // marcadores que se están viendo ahora mismo

    function actualizarEtiqueta() {
      const el = document.getElementById('marker-name');
      el.textContent = window.activeMarker ? ('Marcador detectado: ' + (NOMBRES[window.activeMarker] || window.activeMarker)) : '';
    }

    function mostrarInterfaz(si) {
      document.getElementById('warning-msg').style.display = si ? 'none' : 'block';
      document.getElementById('controls').style.display = si ? 'block' : 'none';
    }

    AFRAME.registerComponent('ar-controller', {
      init: function () {
        const marker = this.el;
        let lostTimer = null;

        marker.addEventListener('markerFound', function () {
          if (lostTimer) { clearTimeout(lostTimer); lostTimer = null; }
          visibles.add(marker.id);

          // Si cambió de marcador, se limpia lo que estaba en pantalla del anterior
          if (window.activeMarker && window.activeMarker !== marker.id) {
            ocultarHistoria();
            ocultarVideos();
          }
          window.activeMarker = marker.id;
          mostrarInterfaz(true);
          actualizarEtiqueta();
          dbg('Marcador detectado: ' + marker.id, 'warn');
        });

        marker.addEventListener('markerLost', function () {
          dbg('Marcador perdido: ' + marker.id);
          if (lostTimer) clearTimeout(lostTimer);
          // Espera 1.5 s por si solo fue un parpadeo
          lostTimer = setTimeout(function () {
            lostTimer = null;
            visibles.delete(marker.id);

            if (visibles.size === 0) {
              // No se ve ningún marcador: se oculta todo
              window.activeMarker = null;
              mostrarInterfaz(false);
              ocultarHistoria();
              ocultarVideos();
            } else if (window.activeMarker === marker.id) {
              // Se perdió este, pero otro sigue visible: se pasa a ese
              window.activeMarker = Array.from(visibles).pop();
              ocultarHistoria();
              ocultarVideos();
            }
            actualizarEtiqueta();
          }, 1500);
        });
      }
    });

    function mostrarTexto() {
      ocultarVideos();
      const h = HISTORIAS[window.activeMarker];
      if (!h) { dbg('No hay historia para: ' + window.activeMarker, 'err'); return; }
      document.getElementById('story-title').textContent = h.titulo;
      document.getElementById('story-text').textContent = h.texto;
      document.getElementById('story-box').style.display = 'block';
    }

    function reproducirVideo() {
      ocultarHistoria();
      ocultarVideos();   // detiene el otro video si estaba corriendo

      const esPan = (window.activeMarker === 'marker-pan');
      const esCal = (window.activeMarker === 'marker-calavera');
      if (!esPan && !esCal) return;

      const vid = document.getElementById(esPan ? 'vid-pan' : 'vid-calavera');
      document.getElementById(esPan ? 'group-pan' : 'group-calavera').setAttribute('visible', 'true');

      dbg('Reproduciendo ' + vid.id + ' (readyState=' + vid.readyState + ')');
      vid.play().then(function () {
        dbg('Video en reproducción');
      }).catch(function (error) {
        dbg('No se pudo reproducir: ' + error.message, 'err');
      });
    }

    function reiniciarExperiencia() {
      document.querySelectorAll('video').forEach(function (vid) {
        vid.pause();
        vid.currentTime = 0;
      });
      ocultarVideos();
      ocultarHistoria();
    }

    // ===== AJUSTE DE ORIENTACIÓN Y TAMAÑO DEL VIDEO =====
    let contentRot = 0;
    let contentScale = 1.5;

    function aplicarAjuste() {
      document.querySelectorAll('.ar-video').forEach(function (el) {
        el.setAttribute('rotation', '-90 0 ' + contentRot);
      });
      document.querySelectorAll('.altar').forEach(function (el) {
        el.setAttribute('rotation', '0 ' + contentRot + ' 0');
      });
      document.querySelectorAll('.ar-group').forEach(function (el) {
        el.setAttribute('scale', contentScale + ' ' + contentScale + ' ' + contentScale);
      });
      dbg('Ajuste -> rotación=' + contentRot + '  escala=' + contentScale.toFixed(2), 'warn');
    }
    function rotarContenido() { contentRot = (contentRot + 90) % 360; aplicarAjuste(); }
    function cambiarEscala(f) { contentScale = Math.max(0.3, Math.min(6, contentScale * f)); aplicarAjuste(); }
  </script>
</head>
<body>

  <div id="debug-panel"></div>

  <div id="story-box">
    <h2 id="story-title"></h2>
    <p id="story-text"></p>
  </div>

  <div id="ui-layer">
    <div id="warning-msg">⚠️ Marcador perdido. Apunta al objeto para continuar.</div>
    <div id="controls">
      <div id="marker-name" style="color:#ffd740; font-size:14px; margin-bottom:4px;"></div>
      <button onclick="mostrarTexto()">Leer Historia</button>
      <button onclick="reproducirVideo()">Ver Video</button>
      <button onclick="reiniciarExperiencia()" style="background-color: #555;">Reiniciar</button>
      <div id="ajustes">
        <button onclick="rotarContenido()" style="background-color: #1e88e5;">⟳ Rotar</button>
        <button onclick="cambiarEscala(1.25)" style="background-color: #1e88e5;">＋ Grande</button>
        <button onclick="cambiarEscala(0.8)" style="background-color: #1e88e5;">－ Chico</button>
      </div>
    </div>
  </div>

  <!-- Sin logarithmicDepthBuffer ni antialias: más ligero para el celular -->
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: false; alpha: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5; trackingMethod: best;">

    <a-assets>
      <video id="vid-pan" src="video_pan.mp4" preload="auto" loop crossorigin="anonymous"
             playsinline webkit-playsinline
             onerror="dbg('No carga video_pan.mp4', 'err')"></video>
      <video id="vid-calavera" src="video_calavera.mp4" preload="auto" loop crossorigin="anonymous"
             playsinline webkit-playsinline
             onerror="dbg('No carga video_calavera.mp4', 'err')"></video>
    </a-assets>

    <!-- Marcador 1: Pan de Muerto -->
    <a-marker type="pattern" url="pattern-PanMuertosIC.patt?v=3" id="marker-pan" ar-controller
              smooth="true" smooth-count="8" smooth-tolerance="0.01" smooth-threshold="2">
      <a-entity class="ar-group" id="group-pan" scale="1.5 1.5 1.5" visible="false">

        <!-- Altar de dos niveles (el de abajo más grande, el de arriba más chico) -->
        <a-entity class="altar" rotation="0 0 0">
          <a-box width="2.4" height="0.2" depth="1.6" position="0 0.1 0" color="#6a1b9a"></a-box>
          <a-box width="1.8" height="0.2" depth="1.1" position="0 0.3 0" color="#ff8c00"></a-box>
        </a-entity>

        <!-- Video sobre el altar -->
        <a-video class="ar-video" src="#vid-pan" width="1.6" height="0.9"
                 position="0 0.42 0" rotation="-90 0 0"></a-video>
      </a-entity>
    </a-marker>

    <!-- Marcador 2: Calaverita -->
    <a-marker type="pattern" url="pattern-CalaveraIC.patt?v=3" id="marker-calavera" ar-controller
              smooth="true" smooth-count="8" smooth-tolerance="0.01" smooth-threshold="2">
      <a-entity class="ar-group" id="group-calavera" scale="1.5 1.5 1.5" visible="false">

        <!-- Altar de dos niveles (el de abajo más grande, el de arriba más chico) -->
        <a-entity class="altar" rotation="0 0 0">
          <a-box width="2.4" height="0.2" depth="1.6" position="0 0.1 0" color="#6a1b9a"></a-box>
          <a-box width="1.8" height="0.2" depth="1.1" position="0 0.3 0" color="#ff8c00"></a-box>
        </a-entity>

        <!-- Video sobre el altar -->
        <a-video class="ar-video" src="#vid-calavera" width="1.6" height="0.9"
                 position="0 0.42 0" rotation="-90 0 0"></a-video>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
