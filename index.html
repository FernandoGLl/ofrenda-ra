<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ofrenda Interactiva AR - Día de Muertos</title>

  <!-- Versiones fijas y estables (CDN confiable de producción) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #ui-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    #warning-msg {
      background-color: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: auto;
      margin-top: 60px;
      font-weight: bold;
      display: block;
      text-align: center;
    }

    #controls {
      background: rgba(0, 0, 0, 0.7);
      padding: 16px;
      border-radius: 15px 15px 0 0;
      width: 100%;
      box-sizing: border-box;
      display: none;
      pointer-events: auto;
      text-align: center;
    }

    button {
      background-color: #ff8c00;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:active { background-color: #cc7000; }

    /* Recuadro de "Leer Historia" */
    #story-box {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 520px);
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.88);
      color: #ffffff;
      border: 2px solid #ff8c00;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      line-height: 1.45;
      display: none;
      z-index: 20;
      pointer-events: auto;
    }
    #story-box h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: #ff8c00;
    }
    #story-box p { margin: 0 0 12px 0; }
    #story-box .btn-close {
      background-color: #444;
      padding: 6px 14px;
      font-size: 14px;
      margin: 0;
    }

    #ajustes { display: block; }

    /* Panel de depuración */
    #debug-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      max-height: 35%;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.75);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.3;
      padding: 4px 6px;
      box-sizing: border-box;
      z-index: 9999;
      pointer-events: none;
      display: none;
    }
    #debug-panel .err { color: #ff5252; }
    #debug-panel .warn { color: #ffd740; }
  </style>

  <script>
    // Panel de depuración: apagado por defecto. Actívalo abriendo la página con ?debug=1
    const DEBUG = false;
    const MODO_DEBUG = DEBUG || location.search.indexOf('debug=1') !== -1;

    function dbg(msg, cls) {
      if (!MODO_DEBUG) return;
      const panel = document.getElementById('debug-panel');
      if (!panel) return;
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      panel.appendChild(line);
      while (panel.children.length > 60) panel.removeChild(panel.firstChild);
      panel.scrollTop = panel.scrollHeight;
    }

    window.addEventListener('error', function (e) {
      dbg('ERROR JS: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')', 'err');
    });
    window.addEventListener('unhandledrejection', function (e) {
      dbg('PROMESA RECHAZADA: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'err');
    });

    window.addEventListener('DOMContentLoaded', function () {
      if (MODO_DEBUG) {
        document.getElementById('debug-panel').style.display = 'block';
      }

      dbg('Página cargada');
      dbg('AFRAME: ' + (window.AFRAME ? AFRAME.version : 'NO CARGÓ'), window.AFRAME ? '' : 'err');

      // Verifica que existan los archivos (solo se nota en modo debug)
      ['video_pan.mp4', 'video_calavera.mp4', 'pattern-PanMuertosIC.patt?v=3', 'pattern-CalaveraIC.patt?v=3']
        .forEach(function (f) {
          fetch(f, { method: 'HEAD' })
            .then(function (r) {
              const size = r.headers.get('content-length');
              dbg(f + ' -> HTTP ' + r.status + (size ? ' (' + Math.round(size / 1024) + ' KB)' : ''),
                  r.ok ? '' : 'err');
            })
            .catch(function (err) { dbg(f + ' -> falló: ' + err.message, 'err'); });
        });

      document.querySelectorAll('video').forEach(function (v) {
        v.addEventListener('loadeddata', function () { dbg(v.id + ': cargado OK'); });
        v.addEventListener('error', function () {
          dbg(v.id + ': ERROR al cargar video (código ' + (v.error ? v.error.code : '?') + ')', 'err');
        });
      });

      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', function () { dbg('Escena A-Frame lista'); });
      scene.addEventListener('camera-error', function (e) {
        dbg('ERROR DE CÁMARA: ' + (e.detail && e.detail.error ? e.detail.error.name + ' ' + e.detail.error.message : 'desconocido'), 'err');
      });
    });

    // ===== TEXTOS DE "LEER HISTORIA" =====
    // Para intercambiar quién va con cada marcador, cambia las claves.
    const HISTORIAS = {
      'marker-pan': {
        titulo: 'Charles Babbage (1791–1871)',
        texto: 'Matemático e inventor inglés, considerado el padre de la computación por idear y diseñar la primera máquina analítica, considerada el concepto inicial de un ordenador programable.'
      },
      'marker-calavera': {
        titulo: 'Ada Lovelace (1815–1852)',
        texto: 'Matemática y escritora inglesa, reconocida como la primera programadora de la historia por escribir un algoritmo destinado a la máquina analítica de Babbage.'
      }
    };

    // ===== LÓGICA DE LA EXPERIENCIA =====
    window.activeMarker = null;

    function ocultarHistoria() {
      document.getElementById('story-box').style.display = 'none';
    }

    // Oculta el altar con el video y pausa todos los videos
    function ocultarVideos() {
      document.querySelectorAll('.ar-group').forEach(function (el) { el.setAttribute('visible', 'false'); });
      document.querySelectorAll('video').forEach(function (vid) { vid.pause(); });
    }

    const NOMBRES = { 'marker-pan': 'Pan de muerto', 'marker-calavera': 'Calavera' };
    const visibles = new Set();   // marcadores que se están viendo ahora mismo

    function actualizarEtiqueta() {
      const el = document.getElementById('marker-name');
      el.textContent = window.activeMarker ? ('Marcador detectado: ' + (NOMBRES[window.activeMarker] || window.activeMarker)) : '';
    }

    function mostrarInterfaz(si) {
      document.getElementById('warning-msg').style.display = si ? 'none' : 'block';
      document.getElementById('controls').style.display = si ? 'block' : 'none';
    }

    AFRAME.registerComponent('ar-controller', {
      init: function () {
        const marker = this.el;
        let lostTimer = null;

        marker.addEventListener('markerFound', function () {
          if (lostTimer) { clearTimeout(lostTimer); lostTimer = null; }
          visibles.add(marker.id);

          // Si cambió de marcador, se limpia lo que estaba en pantalla del anterior
          if (window.activeMarker && window.activeMarker !== marker.id) {
            ocultarHistoria();
            ocultarVideos();
          }
          window.activeMarker = marker.id;
          mostrarInterfaz(true);
          actualizarEtiqueta();
          dbg('Marcador detectado: ' + marker.id, 'warn');
        });

        marker.addEventListener('markerLost', function () {
          dbg('Marcador perdido: ' + marker.id);
          if (lostTimer) clearTimeout(lostTimer);
          // Espera 1.5 s por si solo fue un parpadeo
          lostTimer = setTimeout(function () {
            lostTimer = null;
            visibles.delete(marker.id);

            if (visibles.size === 0) {
              window.activeMarker = null;
              mostrarInterfaz(false);
              ocultarHistoria();
              ocultarVideos();
            } else if (window.activeMarker === marker.id) {
              window.activeMarker = Array.from(visibles).pop();
              ocultarHistoria();
              ocultarVideos();
            }
            actualizarEtiqueta();
          }, 1500);
        });
      }
    });

    function mostrarTexto() {
      ocultarVideos();
      const h = HISTORIAS[window.activeMarker];
      if (!h) { dbg('No hay historia para: ' + window.activeMarker, 'err'); return; }
      document.getElementById('story-title').textContent = h.titulo;
      document.getElementById('story-text').textContent = h.texto;
      document.getElementById('story-box').style.display = 'block';
    }

    function reproducirVideo() {
      ocultarHistoria();
      ocultarVideos();   // detiene el otro video si estaba corriendo

      const esPan = (window.activeMarker === 'marker-pan');
      const esCal = (window.activeMarker === 'marker-calavera');
      if (!esPan && !esCal) return;

      const vid = document.getElementById(esPan ? 'vid-pan' : 'vid-calavera');
      document.getElementById(esPan ? 'group-pan' : 'group-calavera').setAttribute('visible', 'true');

      dbg('Reproduciendo ' + vid.id + ' (readyState=' + vid.readyState + ')');
      vid.play().then(function () {
        dbg('Video en reproducción');
      }).catch(function (error) {
        dbg('No se pudo reproducir: ' + error.message, 'err');
      });
    }

    function reiniciarExperiencia() {
      document.querySelectorAll('video').forEach(function (vid) {
        vid.pause();
        vid.currentTime = 0;
      });
      ocultarVideos();
      ocultarHistoria();
    }

    // ===== TEXTURAS (dibujadas por código, no necesitan archivos de imagen) =====
    const TEXTURAS_CACHE = {};

    function rombo(g, cx, cy, r, color) {
      g.fillStyle = color;
      g.beginPath();
      g.moveTo(cx, cy - r); g.lineTo(cx + r, cy); g.lineTo(cx, cy + r); g.lineTo(cx - r, cy);
      g.closePath(); g.fill();
    }

    // Cada textura es un "mosaico" de 512x128 que se repite en la caja
    function crearTextura(tipo) {
      if (TEXTURAS_CACHE[tipo]) return TEXTURAS_CACHE[tipo];
      const W = 512, H = 128;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d');

      if (tipo === 'mantel') {
        // Mantel bordado: tela morada con franjas y rombos de colores
        g.fillStyle = '#6a1b9a';
        g.fillRect(0, 0, W, H);
        g.lineWidth = 1;
        g.strokeStyle = 'rgba(255,255,255,0.06)';          // hilos verticales
        for (let x = 0; x < W; x += 4) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); g.stroke(); }
        g.strokeStyle = 'rgba(0,0,0,0.10)';                // hilos horizontales
        for (let y = 0; y < H; y += 4) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke(); }

        const franja = function (y, h, col) { g.fillStyle = col; g.fillRect(0, y, W, h); };
        franja(8, 6, '#ffb300');  franja(18, 3, '#ff4fa3');
        franja(H - 14, 6, '#ffb300');  franja(H - 21, 3, '#ff4fa3');

        for (let x = 32; x < W; x += 64) {
          rombo(g, x, H / 2, 26, '#ffb300');
          rombo(g, x, H / 2, 17, '#ff4fa3');
          rombo(g, x, H / 2, 8, '#ffffff');
          g.fillStyle = '#ffd54f';                         // puntitos entre rombos
          g.beginPath(); g.arc(x + 32, H / 2, 5, 0, Math.PI * 2); g.fill();
        }
      } else {
        // Papel picado: banderitas de colores con figuras recortadas
        const OSCURO = '#1c0f1e';
        const colores = ['#ff4fa3', '#ff8c00', '#ffd54f', '#26c6da'];
        g.fillStyle = OSCURO;
        g.fillRect(0, 0, W, H);
        for (let i = 0; i < 4; i++) {
          const x0 = i * 128, cx = x0 + 64;
          g.fillStyle = colores[i];
          g.fillRect(x0 + 4, 6, 120, 110);                 // la banderita

          g.fillStyle = OSCURO;                            // recortes
          for (let k = 0; k < 8; k++) {                    // fila de circulitos arriba
            g.beginPath(); g.arc(x0 + 12 + k * 15, 17, 3.2, 0, Math.PI * 2); g.fill();
          }
          g.strokeStyle = OSCURO; g.lineWidth = 5;         // rombo calado
          g.beginPath();
          g.moveTo(cx, 32); g.lineTo(cx + 32, 62); g.lineTo(cx, 92); g.lineTo(cx - 32, 62);
          g.closePath(); g.stroke();
          rombo(g, cx, 62, 11, OSCURO);                    // rombo central
          g.fillStyle = colores[i];
          g.beginPath(); g.arc(cx, 62, 4, 0, Math.PI * 2); g.fill();
          g.fillStyle = OSCURO;
          for (let k = 0; k < 8; k++) {                    // flequillo ondulado abajo
            g.beginPath(); g.arc(x0 + 12 + k * 15, 116, 7.5, Math.PI, 0); g.fill();
          }
        }
      }
      TEXTURAS_CACHE[tipo] = c.toDataURL('image/png');
      return TEXTURAS_CACHE[tipo];
    }

    // Uso: <a-box textura="tipo: mantel; repeticiones: 2">
    AFRAME.registerComponent('textura', {
      schema: { tipo: { default: 'mantel' }, repeticiones: { default: 2 } },
      init: function () {
        this.el.setAttribute('material', {
          src: crearTextura(this.data.tipo),
          repeat: this.data.repeticiones + ' 1',
          color: '#ffffff',
          roughness: 0.9,
          metalness: 0
        });
      }
    });

    // Uso: <a-entity velas="cantidad: 5; ancho: 2.0"> (se colocan sobre la caja 1, al frente)
    AFRAME.registerComponent('velas', {
      schema: { cantidad: { default: 5 }, ancho: { default: 2.0 } },
      init: function () {
        const n = this.data.cantidad;
        for (let i = 0; i < n; i++) {
          const x = n === 1 ? 0 : (i - (n - 1) / 2) * (this.data.ancho / (n - 1));
          const h = 0.16 + (i % 2) * 0.05;                 // alturas distintas

          const vela = document.createElement('a-cylinder');
          vela.setAttribute('radius', '0.045');
          vela.setAttribute('height', h);
          vela.setAttribute('segments-radial', '12');
          vela.setAttribute('position', x + ' ' + (h / 2) + ' 0');
          vela.setAttribute('material', 'color: #fff3d6; roughness: 0.9; metalness: 0');
          this.el.appendChild(vela);

          const llama = document.createElement('a-sphere');
          llama.setAttribute('radius', '0.035');
          llama.setAttribute('segments-width', '8');
          llama.setAttribute('segments-height', '6');
          llama.setAttribute('position', x + ' ' + (h + 0.05) + ' 0');
          llama.setAttribute('scale', '1 1.5 1');
          llama.setAttribute('material', 'shader: flat; color: #ffcc33');
          llama.setAttribute('animation',
            'property: scale; from: 1 1.4 1; to: 1.2 1.9 1.2; dir: alternate; loop: true; easing: easeInOutSine; dur: ' + (240 + i * 70));
          this.el.appendChild(llama);
        }
      }
    });

    // ===== AJUSTE DE ORIENTACIÓN, INCLINACIÓN Y TAMAÑO =====
    // Rotar:    gira el conjunto sobre el marcador (de 90 en 90).
    // Inclinar: 90 = el altar se ve totalmente de frente desde arriba;
    //           valores menores dejan ver también la parte de arriba de las cajas (más 3D).
    // Tamaño:   escala todo el conjunto.
    const INCLINACIONES = [75, 60, 45, 90];
    let idxIncl = 0;
    let contentRot = 0;
    let contentScale = 1.0;

    function aplicarAjuste() {
      const incl = INCLINACIONES[idxIncl];
      document.querySelectorAll('.ar-rot').forEach(function (el) {
        el.setAttribute('rotation', '0 ' + contentRot + ' 0');
      });
      document.querySelectorAll('.ar-tilt').forEach(function (el) {
        el.setAttribute('rotation', '-' + incl + ' 0 0');
      });
      document.querySelectorAll('.ar-group').forEach(function (el) {
        el.setAttribute('scale', contentScale + ' ' + contentScale + ' ' + contentScale);
      });
      dbg('Ajuste -> rotación=' + contentRot + ' inclinación=' + incl + ' escala=' + contentScale.toFixed(2), 'warn');
    }
    function rotarContenido() { contentRot = (contentRot + 90) % 360; aplicarAjuste(); }
    function inclinarContenido() { idxIncl = (idxIncl + 1) % INCLINACIONES.length; aplicarAjuste(); }
    function cambiarEscala(f) { contentScale = Math.max(0.3, Math.min(6, contentScale * f)); aplicarAjuste(); }
  </script>
</head>
<body>

  <div id="debug-panel"></div>

  <div id="story-box">
    <h2 id="story-title"></h2>
    <p id="story-text"></p>
    <button class="btn-close" onclick="ocultarHistoria()">Cerrar</button>
  </div>

  <div id="ui-layer">
    <div id="warning-msg">⚠️ Marcador perdido. Apunta al objeto para continuar.</div>
    <div id="controls">
      <div id="marker-name" style="color:#ffd740; font-size:14px; margin-bottom:4px;"></div>
      <button onclick="mostrarTexto()">Leer Historia</button>
      <button onclick="reproducirVideo()">Ver Video</button>
      <button onclick="reiniciarExperiencia()" style="background-color: #555;">Reiniciar</button>
      <div id="ajustes">
        <button onclick="rotarContenido()" style="background-color: #1e88e5;">⟳ Rotar</button>
        <button onclick="inclinarContenido()" style="background-color: #1e88e5;">⤴ Inclinar</button>
        <button onclick="cambiarEscala(1.25)" style="background-color: #1e88e5;">＋ Grande</button>
        <button onclick="cambiarEscala(0.8)" style="background-color: #1e88e5;">－ Chico</button>
      </div>
    </div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: false; alpha: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5; trackingMethod: best;">

    <a-assets>
      <video id="vid-pan" src="video_pan.mp4" preload="auto" loop crossorigin="anonymous"
             playsinline webkit-playsinline
             onerror="dbg('No carga video_pan.mp4', 'err')"></video>
      <video id="vid-calavera" src="video_calavera.mp4" preload="auto" loop crossorigin="anonymous"
             playsinline webkit-playsinline
             onerror="dbg('No carga video_calavera.mp4', 'err')"></video>
    </a-assets>

    <!-- Marcador 1: Pan de Muerto -->
    <a-marker type="pattern" url="pattern-PanMuertosIC.patt?v=3" id="marker-pan" ar-controller
              smooth="true" smooth-count="8" smooth-tolerance="0.01" smooth-threshold="2">
      <a-entity class="ar-group" id="group-pan" scale="1 1 1" visible="false">
        <!-- ar-rot: gira el conjunto sobre el marcador (botón Rotar) -->
        <a-entity class="ar-rot" rotation="0 0 0">
          <!-- ar-tilt: inclina el altar hacia ti para verlo de FRENTE aunque mires desde arriba (botón Inclinar) -->
          <a-entity class="ar-tilt" rotation="-75 0 0">

            <!-- Caja 1 (base, la más grande): mantel bordado -->
            <a-box width="2.4" height="0.3" depth="1.0" position="0 0.15 0.5"
                   textura="tipo: mantel; repeticiones: 2"></a-box>

            <!-- Caja 2 (nivel superior, más chica): papel picado -->
            <a-box width="1.8" height="0.3" depth="0.7" position="0 0.45 0.35"
                   textura="tipo: papel; repeticiones: 1.5"></a-box>

            <!-- Velas al frente, sobre la caja 1 -->
            <a-entity velas="cantidad: 5; ancho: 2.0" position="0 0.3 0.85"></a-entity>

            <!-- Video parado sobre la caja 2 -->
            <a-video class="ar-video" src="#vid-pan" width="1.4" height="0.9"
                     position="0 1.05 0.35"></a-video>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-marker>

    <!-- Marcador 2: Calaverita -->
    <a-marker type="pattern" url="pattern-CalaveraIC.patt?v=3" id="marker-calavera" ar-controller
              smooth="true" smooth-count="8" smooth-tolerance="0.01" smooth-threshold="2">
      <a-entity class="ar-group" id="group-calavera" scale="1 1 1" visible="false">
        <!-- ar-rot: gira el conjunto sobre el marcador (botón Rotar) -->
        <a-entity class="ar-rot" rotation="0 0 0">
          <!-- ar-tilt: inclina el altar hacia ti para verlo de FRENTE aunque mires desde arriba (botón Inclinar) -->
          <a-entity class="ar-tilt" rotation="-75 0 0">

            <!-- Caja 1 (base, la más grande): mantel bordado -->
            <a-box width="2.4" height="0.3" depth="1.0" position="0 0.15 0.5"
                   textura="tipo: mantel; repeticiones: 2"></a-box>

            <!-- Caja 2 (nivel superior, más chica): papel picado -->
            <a-box width="1.8" height="0.3" depth="0.7" position="0 0.45 0.35"
                   textura="tipo: papel; repeticiones: 1.5"></a-box>

            <!-- Velas al frente, sobre la caja 1 -->
            <a-entity velas="cantidad: 5; ancho: 2.0" position="0 0.3 0.85"></a-entity>

            <!-- Video parado sobre la caja 2 -->
            <a-video class="ar-video" src="#vid-calavera" width="1.4" height="0.9"
                     position="0 1.05 0.35"></a-video>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-marker>

    <!-- Luces: dan volumen (caras con distinto brillo) a las cajas -->
    <a-light type="ambient" color="#ffffff" intensity="0.65"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.9" position="0 3 2"></a-light>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
